aid: 1126833-b-c-ltd
name: 1126833 B.C. LTD.
description: 1126833 B.C. LTD. is a numbered British Columbia holding company, incorporated in 2017
  and administered c/o Warburg Pincus & Co. at 450 Lexington Avenue, New York. It is not an operating
  business. Its entire public record is nine SEC Form D / Form D-A notices of exempt offering (CIK
  0001737678, industry group "Other", January 2019 through July 2026) covering an equity stock incentive
  plan; the officers named on them are the President and Chief Executive Officer of eSentire, Inc.,
  the Waterloo, Ontario managed detection and response company in which Warburg Pincus holds a majority
  stake, which identifies this entity as the holding vehicle above that operating company. It publishes
  no website, product, documentation or developer surface of its own, and SEC EDGAR records no website
  for it. The group API surface belongs to eSentire, Inc., is profiled separately under the esentire
  slug, and is deliberately not credited here.
